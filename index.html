<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Support Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <div class="max-w-5xl mx-auto px-4 py-8">
        <header class="border-b border-slate-700 pb-6 mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Support Portal</h1>
                <p class="text-slate-400 text-sm">Student Ticketing & Issue Tracking System</p>
            </div>
            <div class="space-x-2">
                <button onclick="switchTab('submit')" id="tab-submit" class="px-4 py-2 text-sm rounded-lg bg-blue-600 text-white font-medium">Submit Issue</button>
                <button onclick="switchTab('track')" id="tab-track" class="px-4 py-2 text-sm rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium">Track Ticket</button>
                <button onclick="switchTab('admin')" id="tab-admin" class="px-4 py-2 text-sm rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium">Admin View</button>
            </div>
        </header>

        <section id="view-submit" class="block">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <h2 class="text-xl font-semibold text-white mb-4">Log a Support Ticket</h2>
                <form id="ticketForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Student ID</label>
                            <input type="text" id="student_id" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                            <input type="text" id="full_name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                            <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Study Mode</label>
                            <select id="study_mode" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                                <option value="Full-Time">Full-Time</option>
                                <option value="Part-Time">Part-Time</option>
                                <option value="Distance">Distance</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Issue Category</label>
                            <select id="category" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                                <option value="Missing Marks">Missing Exam Marks / Delayed Results</option>
                                <option value="E-Learning Access">Loss of E-Learning Access</option>
                                <option value="Attendance">Attendance Register Discrepancy</option>
                                <option value="General Admin">Unanswered Email / General Inquiry</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Priority</label>
                            <select id="priority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Subject</label>
                        <input type="text" id="subject" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Description</label>
                        <textarea id="description" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors">Submit Ticket</button>
                </form>
                <div id="submitResult" class="mt-4 hidden p-4 rounded-lg bg-slate-900 border border-blue-500"></div>
            </div>
        </section>

        <section id="view-track" class="hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-6">
                <h2 class="text-xl font-semibold text-white mb-4">Track Ticket Status</h2>
                <div class="flex gap-3">
                    <input type="text" id="search_ticket_id" placeholder="Enter Ticket ID (e.g. NIT-8492)" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 uppercase">
                    <button onclick="fetchTicketStatus()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2 rounded-lg text-sm transition-colors">Search</button>
                </div>
            </div>
            <div id="trackResult" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-3"></div>
        </section>

        <section id="view-admin" class="hidden">
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-white">Administrative Queue</h2>
                    <button onclick="loadAdminTickets()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-3 py-1.5 rounded-lg">Refresh Queue</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-900 text-xs uppercase text-slate-400 border-b border-slate-700">
                            <tr>
                                <th class="p-3">Ticket ID</th>
                                <th class="p-3">Student ID</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Subject</th>
                                <th class="p-3">Status</th>
                                <th class="p-3">Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody" class="divide-y divide-slate-700"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";

        function switchTab(tab) {
            ['submit', 'track', 'admin'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).className = "px-4 py-2 text-sm rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium";
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "px-4 py-2 text-sm rounded-lg bg-blue-600 text-white font-medium";
            if(tab === 'admin') loadAdminTickets();
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const payload = {
                student_id: document.getElementById('student_id').value,
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                study_mode: document.getElementById('study_mode').value,
                category: document.getElementById('category').value,
                priority: document.getElementById('priority').value,
                subject: document.getElementById('subject').value,
                description: document.getElementById('description').value
            };

            const res = await fetch(`${API_BASE}/tickets`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            const resultDiv = document.getElementById('submitResult');
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = `<p class="text-green-400 font-medium">Ticket Created Successfully!</p>
                <p class="text-sm mt-1">Your Tracking ID is: <strong class="text-white bg-slate-800 px-2 py-0.5 rounded border border-slate-600">${data.ticket_id}</strong></p>`;
            document.getElementById('ticketForm').reset();
        }

        async function fetchTicketStatus() {
            const ticketId = document.getElementById('search_ticket_id').value.trim();
            if(!ticketId) return;
            const res = await fetch(`${API_BASE}/tickets/track/${ticketId}`);
            const resultDiv = document.getElementById('trackResult');
            resultDiv.classList.remove('hidden');
            if(res.status !== 200) {
                resultDiv.innerHTML = `<p class="text-red-400">Ticket ID not found.</p>`;
                return;
            }
            const data = await res.json();
            resultDiv.innerHTML = `
                <div class="flex justify-between items-start">
                    <div>
                        <span class="text-xs text-slate-400">TICKET #${data.ticket_id}</span>
                        <h3 class="text-lg font-bold text-white">${data.subject}</h3>
                    </div>
                    <span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-blue-900/50 text-blue-300 border border-blue-700">${data.status}</span>
                </div>
                <div class="text-xs text-slate-400 border-t border-slate-700 pt-3 grid grid-cols-2 gap-2">
                    <p>Category: <span class="text-slate-200">${data.category}</span></p>
                    <p>Priority: <span class="text-slate-200">${data.priority}</span></p>
                </div>
                <p class="text-sm bg-slate-900 p-3 rounded border border-slate-700 text-slate-300">${data.description}</p>
                <div class="border-t border-slate-700 pt-3">
                    <p class="text-xs font-semibold text-slate-400 uppercase">Latest Admin Update:</p>
                    <p class="text-sm text-blue-300 mt-1">${data.admin_notes || 'No administrative updates yet.'}</p>
                </div>`;
        }

        async function loadAdminTickets() {
            const res = await fetch(`${API_BASE}/admin/tickets`);
            const data = await res.json();
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';
            data.forEach(t => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-3 font-mono text-blue-400">${t.ticket_id}</td>
                        <td class="p-3">${t.student_id}</td>
                        <td class="p-3">${t.category}</td>
                        <td class="p-3">${t.subject}</td>
                        <td class="p-3"><span class="px-2 py-0.5 text-xs rounded bg-slate-700 text-slate-200">${t.status}</span></td>
                        <td class="p-3">
                            <button onclick="updateStatus('${t.ticket_id}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1 rounded">Update</button>
                        </td>
                    </tr>`;
            });
        }

        async function updateStatus(ticketId) {
            const newStatus = prompt("Enter new status (Pending, In Progress, Resolved):");
            const adminNotes = prompt("Enter resolution notes:");
            if(!newStatus) return;
            await fetch(`${API_BASE}/admin/tickets/${ticketId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus, admin_notes: adminNotes })
            });
            loadAdminTickets();
        }
    </script>
</body>
</html>
